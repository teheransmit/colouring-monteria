version: '3.8'

services:
  db:
    image: postgis/postgis:14-3.3
    container_name: colouring-monteria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: teheransmit
      POSTGRES_PASSWORD: "0932"
      POSTGRES_DB: colouringcitiesdb
    ports:
      - "5432:5432"
    volumes:
      - colouring_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teheransmit -d colouringcitiesdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: colouring-monteria-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      WEBAPP_ORIGIN: http://localhost:3000
      PGUSER: teheransmit
      PGPASSWORD: "0932"
      PGDATABASE: colouringcitiesdb
      PGHOST: db
      PGPORT: 5432
      APP_COOKIE_SECRET: "123456"
      CITY_NAME: "Montería"
      MAP_CENTER_LAT: 8.7489
      MAP_CENTER_LON: -75.8814
      DEFAULT_ZOOM: 14
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./app/src:/app/src
      - ./app/public:/app/public
    depends_on:
      db:
        condition: service_healthy

volumes:
  colouring_pgdata:
